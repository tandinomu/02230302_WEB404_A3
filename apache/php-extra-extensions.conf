# php-extra-extensions.conf
# Make Apache execute .phtml and .php5 as PHP, IN ADDITION to the ".php"
# mapping the official image already ships (conf-enabled/docker-php.conf).
#
# Why we add this: the stock php:8.3-apache image maps ONLY ".php". But many
# real-world Apache/PHP servers also run .phtml and .php5 (Apache's own
# default-ssl.conf ships a list that includes "phtml"). Enabling it here makes
# the lab reproduce that common real setup, in which a SINGLE forgotten
# extension in a blacklist is enough for remote code execution.
<FilesMatch "\.(phtml|php5)$">
    SetHandler application/x-httpd-php
</FilesMatch>

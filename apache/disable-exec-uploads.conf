# disable-exec-uploads.conf
# ALTERNATIVE hardening (defence in depth): when uploads MUST stay under the
# web root, disable code execution for that directory, so any uploaded script
# is served as inert text instead of being run by the interpreter.
#
# We apply it to /var/www/html/exec-disabled-demo purely to DEMONSTRATE the
# technique. (Our real secure uploader avoids this problem entirely by storing
# files outside the web root.)
<Directory /var/www/html/exec-disabled-demo>

    # Turn the PHP engine OFF for this directory (mod_php directive).
    php_admin_flag engine off

    # Belt and braces: also remove any handler for script extensions, so even
    # if the flag above were ignored, Apache serves these as static files.
    <FilesMatch "\.(php|phtml|php3|php4|php5|phar)$">
        SetHandler none
    </FilesMatch>

</Directory>
